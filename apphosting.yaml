env:
  - variable: MOBILE_APP_CHECK_ENFORCED
    value: "false"
    availability: [RUNTIME]
  - variable: INVENTORY_WRITES_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: ENGINE_EVENT_DISPATCH_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: ENGINE_EVENT_DISPATCH_AUDIENCE
    value: https://intrakbckend--inventracker-f1229.us-east4.hosted.app/api/internal/engine-events
    availability: [RUNTIME]
  - variable: ENGINE_EVENT_DISPATCH_SERVICE_ACCOUNT
    value: inventraker-engine-events@inventracker-f1229.iam.gserviceaccount.com
    availability: [RUNTIME]
  - variable: STRIPE_SANDBOX_RESTRICTED_KEY
    secret: inventraker-stripe-sandbox-key
    availability: [RUNTIME]
  - variable: STRIPE_BILLING_MODE
    value: sandbox
    availability: [RUNTIME]
  - variable: BILLING_APP_URL
    value: https://intrakbckend--inventracker-f1229.us-east4.hosted.app
    availability: [RUNTIME]
  - variable: STRIPE_WEBHOOK_SECRET
    secret: inventraker-stripe-sandbox-webhook-secret
    availability: [RUNTIME]
