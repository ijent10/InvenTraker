steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - Dockerfile.open-food-facts
      - --tag
      - us-central1-docker.pkg.dev/$PROJECT_ID/importers/open-food-facts:latest
      - .
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/importers/open-food-facts:latest
options:
  logging: CLOUD_LOGGING_ONLY
